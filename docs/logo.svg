<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Discovery-Milestone">
  <title>Discovery-Milestone</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>
  <!-- hexagonal plate -->
  <polygon points="80,8 142,44 142,116 80,152 18,116 18,44" fill="url(#g)"/>
  <polygon points="80,20 131,50 131,110 80,140 29,110 29,50" fill="none" stroke="#99f6e4" stroke-width="2" opacity="0.6"/>
  <!-- flask -->
  <path d="M66 42 h28 v6 h-4 v22 l22 40 a8 8 0 0 1 -7 12 h-50 a8 8 0 0 1 -7 -12 l22 -40 v-22 h-4 z" fill="#ecfeff" opacity="0.95"/>
  <!-- liquid with milestone ticks -->
  <path d="M55 94 h50 l14 24 a5 5 0 0 1 -4 8 h-70 a5 5 0 0 1 -4 -8 z" fill="#f59e0b"/>
  <rect x="62" y="102" width="6" height="6" fill="#0f766e"/>
  <rect x="77" y="102" width="6" height="6" fill="#0f766e"/>
  <rect x="92" y="102" width="6" height="6" fill="#0f766e"/>
  <!-- checkmark seal -->
  <circle cx="118" cy="38" r="15" fill="#f59e0b"/>
  <path d="M110 38 l6 6 l12 -12" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
